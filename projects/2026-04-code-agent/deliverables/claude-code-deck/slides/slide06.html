<!DOCTYPE html>
<!-- 章2封面 · 最小原型 · 金句 -->
<html lang="zh">
<head><meta charset="UTF-8">
<link rel="stylesheet" href="../themes/dark-teal.css">
<style>
p, h1, h2, h3, h4, h5, h6, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
html { background: var(--bg); }
body {
  width: var(--slide-w); height: var(--slide-h); margin: 0; padding: 0;
  font-family: var(--font-sans); color: var(--fg);
  position: relative; background: var(--bg);
}
.slide {
  position: relative; z-index: 1;
  width: var(--slide-w); height: var(--slide-h);
  padding: 60pt 80pt; box-sizing: border-box;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center;
}
.mark { font-size: 72pt; font-weight: var(--fw-bold); color: var(--accent); line-height: 1; }
.quote-text {
  font-size: 40pt; font-weight: var(--fw-bold); color: #FFFFFF;
  line-height: 1.3; max-width: 560pt;
}
.quote-text .accent { color: var(--accent); }
.attribution { margin-top: 24pt; font-size: var(--fs-lede); color: var(--accent-2); letter-spacing: 1pt; }
.source { position: absolute; bottom: 36pt; left: 48pt; font-size: var(--fs-source); color: var(--faint); letter-spacing: 1pt; }
</style></head>
<body>
<div class="slide">
  <p class="mark">"</p>
  <p class="quote-text">30 行 Python，<span class="accent">完整的 Agent</span>。</p>
  <p class="attribution">— 后续 11 课只是往这个循环上叠机制</p>
</div>
<p class="source">CHAPTER 2 · THE MINIMAL PROTOTYPE</p>
</body>
</html>
