<!DOCTYPE html>
<!-- 全局路线图 · timeline · 4 阶段 -->
<html lang="zh">
<head><meta charset="UTF-8">
<link rel="stylesheet" href="../themes/dark-teal.css">
<style>
p, h1, h2, h3, h4, h5, h6, ul, ol { margin: 0; padding: 0; }
ul, ol { list-style: none; }
html { background: var(--bg); }
body {
  width: var(--slide-w); height: var(--slide-h); margin: 0; padding: 0;
  font-family: var(--font-sans); color: var(--fg); background: var(--bg);
}
.slide {
  width: var(--slide-w); height: var(--slide-h);
  padding: var(--pad-slide); box-sizing: border-box;
  display: flex; flex-direction: column;
}
.eyebrow { font-weight: var(--fw-light); font-size: var(--fs-label); letter-spacing: 3pt; color: var(--accent); margin: 0 0 6pt 0; }
.title { font-size: var(--fs-title); font-weight: var(--fw-bold); color: #FFFFFF; margin: 0 0 20pt 0; line-height: 1.2; }
.title .accent { color: var(--accent); }
.timeline { display: flex; flex-direction: column; flex: 1; justify-content: center; }
.axis { position: relative; height: 2pt; background: var(--dim); margin: 0 20pt; }
.nodes { display: flex; flex-direction: row; justify-content: space-between; margin: -8pt 0 0 0; padding: 0 12pt; }
.node { display: flex; flex-direction: column; align-items: center; text-align: center; width: 148pt; }
.dot { width: 14pt; height: 14pt; background: var(--accent); border: 3pt solid var(--bg); border-radius: 50%; }
.part-no { font-size: 13pt; font-weight: var(--fw-bold); color: var(--accent-2); margin: 10pt 0 2pt 0; letter-spacing: 1pt; }
.stage { font-size: 13pt; font-weight: var(--fw-bold); color: #FFFFFF; margin: 0 0 5pt 0; line-height: 1.3; }
.detail { font-size: 9pt; color: var(--fg); line-height: 1.4; }
.source { font-size: var(--fs-source); color: var(--faint); letter-spacing: 1pt; margin: 10pt 0 0 0; }
</style></head>
<body>
<div class="slide">
  <p class="eyebrow">OVERVIEW · ROADMAP</p>
  <h1 class="title">四个 Part，<span class="accent">12 个机制</span>递进叠加</h1>
  <div class="timeline">
    <div class="axis"></div>
    <div class="nodes">
      <div class="node">
        <div class="dot"></div>
        <p class="part-no">PART A</p>
        <p class="stage">循环与工具</p>
        <p class="detail">s01–s03<br>Loop · Tools · TodoWrite</p>
      </div>
      <div class="node">
        <div class="dot"></div>
        <p class="part-no">PART B</p>
        <p class="stage">知识与记忆</p>
        <p class="detail">s04–s06<br>Subagent · Skills · Compact</p>
      </div>
      <div class="node">
        <div class="dot"></div>
        <p class="part-no">PART C</p>
        <p class="stage">任务与并发</p>
        <p class="detail">s07–s08<br>Task DAG · Background</p>
      </div>
      <div class="node">
        <div class="dot"></div>
        <p class="part-no">PART D</p>
        <p class="stage">多 Agent 协作</p>
        <p class="detail">s09–s12<br>Teams · FSM · Worktree</p>
      </div>
    </div>
  </div>
  <p class="source">learn-claude-code · shareAI-lab / NanmiCoder cc-haha</p>
</div>
</body>
</html>
