[project]
name = "quant-data"
version = "0.1.0"
description = "A-share market data pipeline: Tushare + AkShare -> DuckDB"
requires-python = ">=3.11"
dependencies = [
    "tushare>=1.4.0",
    "akshare>=1.15.0",
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant_data"]

[tool.ruff]
line-length = 100
target-version = "py311"
